[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-pulse-mcp"
version = "0.3.0"
description = "SEO Pulse: local marketing reports MCP"
authors = [{name="LS-Labs"}]
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1,<2", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8"]
google = ["google-auth", "google-auth-oauthlib", "google-api-python-client", "google-analytics-data"]

[project.scripts]
seo-pulse = "seo_pulse_mcp.server:main"

[tool.setuptools.packages.find]
include = ["seo_pulse_mcp*"]

[tool.setuptools.package-data]
seo_pulse_mcp = ["fixtures/*.json", "config/*.json"]
