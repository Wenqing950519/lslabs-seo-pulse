[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lslabs_reports"
version = "0.1.0"
description = "LS-Labs fixture-based marketing reports MCP skeleton"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lslabs-reports = "lslabs_reports.server:main"

[tool.setuptools.packages.find]
include = ["lslabs_reports*"]

[tool.setuptools.package-data]
lslabs_reports = ["fixtures/*.json", "config/*.json"]
